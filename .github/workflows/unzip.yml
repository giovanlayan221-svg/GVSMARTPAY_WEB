
name: Unzip GVSMARTPAY WEB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP_FILE="gvsmartpay-web.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file tidak ditemukan!"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          cp -a extracted/. .

          rm -rf extracted
          rm -f "$ZIP_FILE"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Deploy GVSMARTPAY WEB update" || echo "No changes"
          git push
          
