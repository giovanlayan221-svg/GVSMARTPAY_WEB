name: Extract ZIP

# Upload file .zip ke root repo (lewat Add file > Upload files), workflow ini
# otomatis meng-extract isinya ke repo, lalu menghapus zip-nya.
on:
  workflow_dispatch:
  push:
    paths: ['*.zip']

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract semua zip di root
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "Tidak ada file zip di root."; exit 0; fi
          for z in "${zips[@]}"; do
            echo "Extract: $z"
            unzip -o "$z" -x ".github/*" "__MACOSX/*"
            rm -f "$z"
          done

      - name: Commit hasil extract
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Tidak ada perubahan."; exit 0; fi
          git commit -m "Extract zip otomatis"
          git push
          
