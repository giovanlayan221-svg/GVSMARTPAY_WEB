.plus,.wbtn,.dl i{}

.qpay{display:flex;flex-direction:column;gap:12px}.qph{display:flex;align-items:center;justify-content:space-between;gap:8px}.qph h3{margin:0}
.qlive{display:inline-flex;align-items:center;gap:6px;background:var(--pl);color:var(--pt);font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;white-space:nowrap}.qlive u{width:8px;height:8px;border-radius:50%;background:var(--ok);display:block;animation:qpulse 1.6s ease-out infinite}
.qhero{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto;grid-template-areas:"a r" "t t";gap:10px 12px;align-items:center;padding:16px;border-radius:22px;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 12px 28px #7c3aed38}
.qhero:before{content:"";position:absolute;right:-40px;top:-50px;width:150px;height:150px;border-radius:50%;background:#ffffff1c;pointer-events:none}.qhero:after{content:"";position:absolute;left:-30px;bottom:-60px;width:130px;height:130px;border-radius:50%;background:#ffffff12;pointer-events:none}
.qhl{grid-area:a;display:flex;flex-direction:column;gap:2px;position:relative;z-index:1}.qhl small{color:#fff;opacity:.85;font-size:12px}.qhl b{font-size:30px;line-height:1.1;letter-spacing:-.5px;font-variant-numeric:tabular-nums}.qhl span{font-size:11.5px;opacity:.85}
.qring{grid-area:r;position:relative;width:56px;height:56px;z-index:1;display:grid;place-items:center}.qring svg{position:absolute;inset:0;width:56px;height:56px;transform:rotate(-90deg)}.qring circle{fill:none;stroke-width:5}.qring .bg{stroke:#ffffff38}.qring .fg{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset 1s linear}.qring i{position:absolute;inset:0;display:grid;place-items:center}.qring .i{width:20px;height:20px;color:#fff}
.qtime{grid-area:t;position:relative;z-index:1;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;background:#ffffff24;border-radius:14px;padding:9px 12px}.qtime small{color:#fff;opacity:.9;font-size:12px}.qtime b{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:.5px}.qtime span{flex-basis:100%;font-size:11px;opacity:.85}
.qhero[data-u=warn]{background:linear-gradient(135deg,#d97706,#b45309);box-shadow:0 12px 28px #d9770638}.qhero[data-u=crit]{background:linear-gradient(135deg,#dc2626,#991b1b);box-shadow:0 12px 28px #dc262638}.qhero[data-u=crit] .qtime b{animation:qblink 1s steps(2) infinite}.qhero[data-u=dead]{background:linear-gradient(135deg,#6b7280,#374151);box-shadow:none}
.qcw{display:flex;flex-direction:column;align-items:center;gap:8px}.qcard2{position:relative;padding:26px;border-radius:26px;background:#fff;box-shadow:0 10px 30px #1b123324,0 0 0 1px var(--ln);overflow:hidden}.qcard2 #qrq{display:grid;place-items:center;line-height:0}.qcard2 #qrq img,.qcard2 #qrq canvas{max-width:100%;height:auto;border-radius:6px}
.qcard2>i.c1,.qcard2>i.c2,.qcard2>i.c3,.qcard2>i.c4{position:absolute;width:22px;height:22px;border:4px solid var(--p);pointer-events:none}.qcard2>i.c1{left:8px;top:8px;border-right:0;border-bottom:0;border-top-left-radius:12px}.qcard2>i.c2{right:8px;top:8px;border-left:0;border-bottom:0;border-top-right-radius:12px}.qcard2>i.c3{left:8px;bottom:8px;border-right:0;border-top:0;border-bottom-left-radius:12px}.qcard2>i.c4{right:8px;bottom:8px;border-left:0;border-top:0;border-bottom-right-radius:12px}
.qscan{position:absolute;left:18px;right:18px;top:18px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--p),transparent);box-shadow:0 0 14px 2px #7c3aed77;animation:qscan 2.6s ease-in-out infinite;pointer-events:none}
.qexp{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:20px;background:#fffffff2;color:#1b1233}.qexp.on{display:flex}.qexp .i{width:34px;height:34px;color:#b91c1c}.qexp span{font-size:12px;color:#625a79}.qcard2:has(.qexp.on) .qscan{display:none}
.qhint{color:var(--mu);text-align:center;font-size:12px}
.qdet{background:var(--pl);border-radius:18px;padding:6px 14px}.qdet .kv{padding:8px 0}
.qnote{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--mu);line-height:1.5}.qnote i{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--pl);color:var(--pt)}.qnote .i{width:17px;height:17px}
.qbt{display:grid;grid-template-columns:1fr 1fr;gap:8px}.qbt .btn{display:flex;align-items:center;justify-content:center;gap:6px}.qbt .i{width:17px;height:17px}
.okc i{animation:qpop .55s cubic-bezier(.2,1.4,.4,1) both,qripple 1.8s ease-out .5s 2}
@keyframes qpulse{0%{box-shadow:0 0 0 0 #0e9f6e88}80%,100%{box-shadow:0 0 0 8px #0e9f6e00}}@keyframes qscan{0%,100%{top:18px;opacity:0}8%,92%{opacity:1}50%{top:calc(100% - 21px)}}@keyframes qblink{50%{opacity:.55}}@keyframes qpop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}@keyframes qripple{0%{box-shadow:0 0 0 0 #7c3aed66}100%{box-shadow:0 0 0 22px #7c3aed00}}

const PQKEY='gvsp_pushq';
function pushNotify(uid,title,body,url,tag){return pushSend({uid,title,body,url:url||'/',tag:tag||undefined,nonce:Date.now().toString(36)+Math.random().toString(36).slice(2,8),at:Date.now()},3)}
async function pushSend(job,tries){
  if(DEMO||typeof auth=='undefined')return null;
  for(let i=0;i<tries;i++){
    try{
      const cu=auth.currentUser;if(!cu)break;
      const t=await cu.getIdToken(),r=await fetch('/api/notify',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(job)});
      if(r.ok||(r.status<500&&r.status!=429))return await r.json().catch(()=>({}));
    }catch(e){}
    await new Promise(r=>setTimeout(r,700*(i+1)));
  }
  pushQ(job);return null}
function pushQ(job){try{const q=JSON.parse(localStorage.getItem(PQKEY)||'[]').filter(x=>Date.now()-x.at<864e5);if(q.length<40)q.push(job);localStorage.setItem(PQKEY,JSON.stringify(q))}catch(e){}}
async function pushFlush(){try{const q=JSON.parse(localStorage.getItem(PQKEY)||'[]');if(!q.length||typeof auth=='undefined'||!auth.currentUser)return;localStorage.removeItem(PQKEY);for(const j of q){if(Date.now()-j.at<864e5)await pushSend(j,1)}}catch(e){}}

else if(r.status=='dikreditkan'){clearInterval(QT);QP=null;sheet(`<div class="okc"><i>[[check]]</i><h3>Pembayaran diterima</h3><p class="m">Waktu bayar sudah habis atau harga berubah, jadi uangmu masuk ke <b>saldo GVSMARTPAY</b>. Silakan pesan ulang.</p></div><button class="btn w g2" data-a="close">Tutup</button>`)}
else if(r.status=='selisih'||r.status=='perlu-dicek'){clearInterval(QT);QP=null;sheet(`<div class="okc"><i>[[check]]</i><h3>Pembayaran sedang dicek</h3><p class="m">Admin akan memeriksa pembayaranmu. Simpan bukti bayar.</p></div><button class="btn w g2" data-a="close">Tutup</button>`)}}

const st={ok:'Diterima FCM',partial:'Sebagian diterima FCM',failed:'GAGAL dikirim ke FCM','no-token':'Tidak ada perangkat terdaftar',sending:'Belum selesai'},fm=x=>new Date(x).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});

/* ---------- Tema tampilan: Terang / Gelap / Otomatis ---------- */
const THEME_KEY='gvsp_theme';
const themeMode=()=>{try{return localStorage.getItem(THEME_KEY)||'light'}catch(e){return 'light'}};
function applyTheme(){const m=themeMode(),d=m=='dark'||(m=='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');const mt=document.querySelector('meta[name=theme-color]');if(mt)mt.setAttribute('content',d?'#1a1030':'#7c3aed')}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(themeMode()=='auto')applyTheme()})}catch(e){}
applyTheme();
act.theme=()=>{const m=themeMode(),o=(k,ic,t,d)=>`<div class="lr" data-a="settheme" data-m="${k}"><div class="ci">${ic}</div><div class="fl"><b>${t}</b><small>${d}</small></div><span style="color:var(--pt)">${m==k?'[[check]]':''}</span></div>`;sheet(`<h3>Tema tampilan</h3>${o('light','[[sun]]','Terang','Putih dan ungu')}${o('dark','[[moon]]','Gelap','Nyaman di malam hari dan hemat baterai')}${o('auto','[[settings]]','Otomatis','Ikuti pengaturan HP')}<button class="btn w g2" style="margin-top:10px" data-a="close">Tutup</button>`)};
act.settheme=d=>{try{localStorage.setItem(THEME_KEY,d.m)}catch(e){}applyTheme();close();toast('Tema '+({light:'Terang',dark:'Gelap',auto:'Otomatis'}[d.m]||'')+' dipakai');render()};

    ok('Kunci Web Push terpasang');
    let p=Notification.permission;if(p==='default'){show(false);p=await Notification.requestPermission()}
    if(p!=='granted'){no('Izin notifikasi: <b>'+p+'</b>. Buka Chrome, ketuk ikon gembok/titik tiga, Setelan situs, Notifikasi, lalu Izinkan. Setelah itu coba lagi.');return show(true)}
    ok('Izin notifikasi diberikan');show(false);}
    let tok;try{tok=await setupPush(true)}catch(e){no('Gagal membuat token: '+(e.code||'')+' '+(e.message||e));return show(true)}
    ok('Token HP berhasil dibuat dan disimpan');show(false);
    L.push('\u23f3 Notifikasi tes dikirim <b>8 detik lagi</b>. Segera tekan tombol Home / keluar dari app sekarang.');show(true);
    const idt=await auth.currentUser.getIdToken();const r=await fetch('/api/notify',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+idt},body:JSON.stringify({uid:ME.uid,title:'Tes GVSMARTPAY',body:'Notifikasi berhasil masuk ke HP-mu',delay:8})});
    const j=await r.json().catch(()=>({}));
    L.pop();
    if(!r.ok||j.error)no('Server Vercel error: '+(j.error||('HTTP '+r.status))+(r.status==404?' (file api/notify.js tidak ter-deploy)':''));
    else if(j.sent>0)ok('Server berhasil mengirim ke Firebase. Kalau notifikasi tidak muncul di HP, cek izin notifikasi & penghemat baterai untuk Chrome/aplikasi.');
    else no('Server tidak mengirim: '+(j.reason||'')+' '+(j.errors?JSON.stringify(j.errors):''));
    show(true);
  }catch(e){no('Error: '+(e.message||e));show(true)}
};

/* ---------- 8. Layanan Lainnya: kategori Beli atau Kerja ---------- */
{const _m=ADV.menu;ADV.menu=()=>{let h=_m();const add=`<label>Jenis kategori</label><select id="mnk" class="in"><option value="beli">Beli (produk seperti Pulsa & lainnya)</option><option value="kerja">Kerja (pengguna isi data, upah masuk saldo PPOB)</option></select><div id="mnkw" style="display:none"><label>Deskripsi pekerjaan</label><textarea id="mkd" class="in" rows="3" placeholder="Jelaskan apa yang harus dikerjakan"></textarea><label>Data yang diisi pengguna (pisah koma)</label><input id="mkf" class="in" placeholder="mis. Email, Password, Email pemulihan"><label>Upah per pekerjaan (Rp)</label><input id="mkr" class="in" inputmode="numeric" placeholder="mis. 2000"></div>`;
 h=h.replace('<label>Ikon</label><div style="display:flex;gap:10px;align-items:center"><span id="mnprev"',add+'<label>Ikon</label><div style="display:flex;gap:10px;align-items:center"><span id="mnprev"');
 const cs=[...CATS].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
 return h+`<div class="card"><h3>Jenis kategori: Beli atau Kerja</h3><p class="m">Beli = produk dengan harga seperti Pulsa. Kerja = pengguna mengisi data (email, password, dll) dan upahnya masuk ke saldo PPOB setelah kamu setujui di tab Kerja.</p>${cs.length?cs.map(c=>`<div style="border:1px solid var(--ln);border-radius:16px;padding:12px;margin-top:10px"><b>${ESC(c.name)}</b><label>Jenis</label><select class="in" data-ck="${c.id}" data-k="kind"><option value="beli" ${c.kind!='kerja'?'selected':''}>Beli</option><option value="kerja" ${c.kind=='kerja'?'selected':''}>Kerja</option></select>${c.kind=='kerja'?`<label>Deskripsi pekerjaan</label><textarea class="in" rows="3" data-ck="${c.id}" data-k="desc">${ESC(c.desc||'')}</textarea><label>Data yang diisi pengguna (pisah koma)</label><input class="in" data-ck="${c.id}" data-k="fields" value="${ESC((c.fields||[]).join(', '))}"><label>Upah per pekerjaan (Rp)</label><input class="in" inputmode="numeric" data-ck="${c.id}" data-k="reward" value="${c.reward||0}">`:''}</div>`).join(''):'<p class="m">Belum ada kategori.</p>'}</div>`}}
act.mnadd=async()=>{const n=($('#mnn').value||'').trim().replace(/\s+/g,' ');if(!n)return toast('Isi nama kategori');if(CATS.some(c=>String(c.name).toLowerCase()==n.toLowerCase()))return toast('Nama kategori sudah ada');const kerja=($('#mnk')||{}).value=='kerja',o={name:n,icon:$('#mni').value||'box',tab:$('#mnt').value||'isi',status:$('#mns').value||'',kind:kerja?'kerja':'beli',createdAt:Date.now()};if(kerja){o.desc=($('#mkd').value||'').trim();o.fields=($('#mkf').value||'').split(',').map(x=>x.trim()).filter(Boolean);o.reward=num($('#mkr').value);if(!o.fields.length)return toast('Isi data yang harus diisi pengguna');if(o.reward<1)return toast('Isi upah per pekerjaan')}try{await db.collection('categories').add(o);$('#mnn').value='';toast('Kategori ditambahkan')}catch(e){fe(e)}};
{const _co=act.copen;act.copen=d=>{const c=CATS.find(x=>x.name==d.n);if(c&&c.kind=='kerja'){WKC=c.id;WKV={};return act.go({p:'work'})}return _co(d)}}
P.work=()=>{const c=CATS.find(x=>x.id==WKC);if(!c)return `${th('Kerja')}${empty('[[briefcase]]','Kategori tidak ditemukan','')}`;const fl=c.fields&&c.fields.length?c.fields:['Data'],mine=WORKS.filter(w=>w.catId==c.id).sort((a,b)=>b.createdAt-a.createdAt),st={menunggu:['wt','Menunggu'],disetujui:['ok','Disetujui'],ditolak:['no','Ditolak']};
 return `${th(ESC(c.name))}<div class="pd" style="padding-top:8px"><div class="card"><div class="pr2"><b>Upah per pekerjaan</b><span class="chip2">${rp(c.reward||0)}</span></div><p class="m" style="margin-top:8px;white-space:pre-wrap">${ESC(c.desc||'')}</p><small style="display:block;margin-top:6px">Setelah disetujui admin, upah otomatis masuk ke saldo PPOB.</small></div><div class="card"><h3>Isi data pekerjaan</h3>${fl.map((l,i)=>`<label ${i?'':'style="margin-top:0"'}>${ESC(l)} <b class="rq">*</b></label><input class="in" data-wf="${i}" autocomplete="off" autocapitalize="off" value="${ESC(WKV[i]||'')}">`).join('')}<label>Catatan (opsional)</label><input class="in" data-wf="n" autocomplete="off" value="${ESC(WKV.n||'')}"><button class="btn w" style="margin-top:14px" data-a="wsub">Kirim Pekerjaan</button></div><h3>Riwayat pekerjaanmu</h3>${mine.length?`<div class="card" style="padding:4px 0">${mine.map(w=>{const s=st[w.status]||st.menunggu;return `<div class="rh"><div class="ci">[[briefcase]]</div><div class="fl"><b>${ESC((w.data&&w.data[0]&&w.data[0].v)||c.name)}</b><small>${fd(w.createdAt)}</small></div><div class="rt"><span class="tag ${TS&&TS[w.status]||''}">${s[1]}</span>${w.status=='disetujui'?`<span class="nm ok2">+${rp(w.reward||0)}</span>`:''}</div></div>`}).join('')}</div>`:empty('[[briefcase]]','Belum ada pekerjaan','Pekerjaan yang kamu kirim tampil di sini.')}</div>`};
document.addEventListener('input',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.wf!==undefined)WKV[t.dataset.wf]=t.value});
act.wsub=async()=>{const c=CATS.find(x=>x.id==WKC);if(!c)return;const fl=c.fields&&c.fields.length?c.fields:['Data'],data=[];for(let i=0;i<fl.length;i++){const v=String(WKV[i]||'').trim();if(!v)return toast('Isi '+fl[i]);data.push({k:fl[i],v})}try{await db.collection('works').add({uid:ME.uid,userName:ME.name,catId:c.id,catName:c.name,reward:c.reward||0,data,note:String(WKV.n||'').trim(),status:'menunggu',createdAt:Date.now()});try{pushNotify('admin','Pekerjaan baru',(ME.name||'Pengguna')+' mengirim pekerjaan: '+c.name,'/','work-'+Date.now())}catch(x){}WKV={};render();toast('Pekerjaan terkirim, menunggu pengecekan admin')}catch(e){fe(e)}};
ADV.work=()=>{const pend=WORKS.filter(w=>w.status=='menunggu').sort((a,b)=>a.createdAt-b.createdAt),rest=WORKS.filter(w=>w.status!='menunggu').sort((a,b)=>b.createdAt-a.createdAt).slice(0,30);
 return `<h3>Pekerjaan menunggu (${pend.length})</h3>${pend.length?pend.map(w=>`<div class="card"><div class="pr2"><b>${ESC(w.userName||'')}</b><span class="chip2">${ESC(w.catName||'')}</span></div>${(w.data||[]).map(x=>`<div class="kv"><span>${ESC(x.k)}</span><b style="word-break:break-all;user-select:all">${ESC(x.v)}</b></div>`).join('')}${w.note?`<small style="display:block;margin-top:6px">Catatan: ${ESC(w.note)}</small>`:''}<small style="display:block;margin-top:6px">${fd(w.createdAt)} · Upah ${rp(w.reward||0)}</small><div class="two" style="margin-top:10px"><button class="btn s" data-a="wok" data-id="${w.id}">Setujui + bayar</button><button class="btn s g2" data-a="wno" data-id="${w.id}">Tolak</button></div></div>`).join(''):'<p class="m">Tidak ada.</p>'}<h3>Riwayat</h3>${rest.length?`<div class="card">${rest.map(w=>`<div class="it"><div class="fl"><b>${ESC(w.userName||'')}</b><small>${ESC(w.catName||'')} · ${fd(w.createdAt)}</small></div><div class="r"><b>${w.status=='disetujui'?'Disetujui':'Ditolak'}</b><br><small>${rp(w.reward||0)}</small></div></div>`).join('')}</div>`:'<p class="m">Belum ada.</p>'}`};
function workNote(w,t,b){db.collection('notifications').add({uid:w.uid,type:'work',title:t,body:b,read:false,createdAt:Date.now()}).catch(()=>{});try{pushNotify(w.uid,t,b)}catch(e){}}
act.wok=async d=>{const w=WORKS.find(x=>x.id==d.id);if(!w||w.status!='menunggu')return;try{await db.runTransaction(async tx=>{const wr=db.collection('works').doc(w.id),ur=db.collection('users').doc(w.uid),ws=await tx.get(wr);if(!ws.exists||ws.data().status!='menunggu')throw{code:'sudah-diproses'};const us=await tx.get(ur);tx.update(ur,{balance:(us.data().balance||0)+(w.reward||0)});tx.update(wr,{status:'disetujui',reviewedAt:Date.now()})});workNote(w,'Pekerjaan disetujui',rp(w.reward||0)+' sudah masuk ke saldo PPOB kamu.');toast('Disetujui, saldo ditambahkan')}catch(e){fe(e)}};
act.wno=async d=>{const w=WORKS.find(x=>x.id==d.id);if(!w||w.status!='menunggu')return;try{await db.collection('works').doc(w.id).update({status:'ditolak',reviewedAt:Date.now()});workNote(w,'Pekerjaan ditolak','Data pekerjaan '+(w.catName||'')+' belum sesuai. Silakan kirim ulang.');toast('Ditolak')}catch(e){fe(e)}};

const rateOf=(c,k)=>{const v=c&&c.rates?Number(c.rates[k]):0;return v>0?v:Number(c&&c.rate||0)};
const unitOf=c=>{const v=Number(c&&c.unit);return v>=1?Math.floor(v):1000};
const unitTxt=c=>{const u=unitOf(c);return u%1000==0?(u/1000)+'K':String(u)};
const platOf=u=>{u=String(u||'').toLowerCase();return /tiktok\.com/.test(u)?'tiktok':/facebook\.com|fb\.watch|fb\.com/.test(u)?'facebook':/instagram\.com|instagr\.am/.test(u)?'instagram':''};
const rateTxt=c=>{const pl=(c.plats&&c.plats.length?c.plats:['tiktok','facebook','instagram']).filter(k=>PLT[k]),r=[...new Set(pl.map(k=>rateOf(c,k)))].sort((a,b)=>a-b);return r.length>1?rp(r[0])+' - '+rp(r[r.length-1]):rp(r[0]||0)};
const cpLeft=c=>c.budget>0?Math.max(0,Math.min(100,Math.round(100-(c.used||0)/c.budget*100))):null;

 <div style="display:flex;gap:24px;flex-wrap:wrap">${c.lang?`<div><div class="cdh">Bahasa</div><span class="cdc">${ESC(c.lang)}</span></div>`:''}<div><div class="cdh">Platform</div><div style="display:flex;gap:14px;color:var(--pt);align-items:center;height:38px">${pl.map(k=>pltIc(k,26)).join('')}</div></div></div>
 ${c.tags&&c.tags.length?`<div class="cdh">Hashtag</div><div style="display:flex;gap:8px;flex-wrap:wrap">${c.tags.map(x=>`<span class="cdc">#${ESC(x)}</span>`).join('')}</div>`:''}
 <div class="cdh">Payment</div>${pl.map(k=>`<div class="cdr"><span style="color:var(--pt);display:grid">${pltIc(k,22)}</span><span>${rp(rateOf(c,k))} / ${unitTxt(c)} views</span></div>`).join('')}${c.minV?`<div class="cdr" style="background:var(--pl);border-color:#ddd6fe;color:#5b21b6">[[coin]] Min ${nf(c.minV)} views to Payout</div>`:''}${c.maxV?`<div class="cdr" style="background:#f3e8ff;border-color:#e9d5ff;color:#6b21a8">[[coin]] Max ${nf(c.maxV)} views to Payout</div>`:''}

const OPPFX={Telkomsel:['0811','0812','0813','0821','0822','0823','0851','0852','0853'],Indosat:['0814','0815','0816','0855','0856','0857','0858'],XL:['0817','0818','0819','0859','0877','0878'],Axis:['0831','0832','0833','0838'],Three:['0895','0896','0897','0898','0899'],Smartfren:['0881','0882','0883','0884','0885','0886','0887','0888','0889'],'by.U':['0851']};

/* ---------- 1. TOKEN ---------- */
:root{

  --tile3:linear-gradient(145deg,#fdf1ff,#f3d9ff);--tile3-c:#a21caf;
  --cv-hl:inset 0 1px 0 rgba(255,255,255,.9);
}
html[data-theme=dark]{
  --bg:#0d0919;--cd:#17122b;--pl:#251c42;--ln:#2d2449;--tx:#f1ecff;--mu:#aca4c8;

}

.sw .pills{margin-top:12px;gap:8px}

  box-shadow:0 10px 18px -12px rgba(0,0,0,.55);transition:transform .14s}
.sw .pills button .i{width:17px;height:17px;color:#7c3aed}
.sw .mq{background:rgba(255,255,255,.14);border:0;border-radius:14px;margin-top:10px;color:#fff}
.sw .mq .i,.sw .mq .mt{color:#fff}
.sw .mq .mt{font-size:12.5px;font-weight:600}

/* ---------- 7. GRID LAYANAN ---------- */
.gd{gap:16px 4px}
.ib{gap:7px;font-size:11.5px;font-weight:700;color:var(--tx);line-height:1.25}
.ib i{width:54px;height:54px;border-radius:19px;border:0;background:var(--tile);color:var(--tile-c);
  box-shadow:var(--cv-hl),0 8px 14px -10px rgba(91,33,182,.55);transition:transform .16s cubic-bezier(.3,1.6,.5,1)}
.ib i .i{width:25px;height:25px}
.ib:nth-child(3n+2) i{background:var(--tile2);color:var(--tile2-c)}
.ib:nth-child(3n+3) i{background:var(--tile3);color:var(--tile3-c)}
.ib i:has(img){background:#fff;padding:8px}
.ib i img{width:100%;height:100%;object-fit:contain;border-radius:10px}
.ib:active i{transform:scale(.9)}
.ib.soon,.ib.soon i{opacity:1}
.ib.soon i{background:var(--pl);color:var(--mu);box-shadow:none}
.ib.soon{color:var(--mu)}
.ib .badge-soon{top:41px;right:auto;left:50%;transform:translateX(-50%);background:var(--cd);color:var(--mu);border:1px solid var(--ln);
  font-size:8px;font-weight:800;padding:2px 6px;border-radius:99px;box-shadow:0 2px 6px -2px rgba(49,24,110,.25)}
.gc .badge-soon{top:10px;right:10px;background:var(--pl);color:var(--mu);font-size:9px;padding:3px 8px;border-radius:99px}
.tile{border-radius:18px;background:var(--tile);color:var(--tile-c);box-shadow:var(--cv-hl)}
.tile:has(img){background:#fff}

/* ---------- 8. BAR ATAS HALAMAN ---------- */
.th{position:sticky;top:0;z-index:6;background:var(--bg);border:0;padding:12px 14px 10px;gap:12px;font-size:17px;font-weight:800;letter-spacing:-.025em}
.th button{width:40px;height:40px;border-radius:14px;background:var(--cd);box-shadow:var(--sh1);display:grid;place-items:center;color:var(--tx);flex:none;font-size:20px}
.th button .i{width:20px;height:20px}

/* ---------- 9. HERO HALAMAN ---------- */
.hero,.kh{position:relative;overflow:hidden;margin:6px 14px 0;padding:16px;border-radius:26px;background:var(--grad);color:#fff;gap:14px;
  box-shadow:0 20px 34px -18px rgba(76,29,149,.8)}
.hero::after,.kh::after{content:"";position:absolute;right:-50px;top:-70px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.26),rgba(255,255,255,0) 70%);pointer-events:none}
.hero>*,.kh>*{position:relative;z-index:1}
.hero h2,.kh h2{color:#fff;font-size:18px}
.hero p,.kh p{color:rgba(255,255,255,.88)}
.hero .hi,.kh .hi{background:rgba(255,255,255,.2);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.hero .ch span,.kh .ch span{background:rgba(255,255,255,.2);color:#fff;border:0;font-weight:700}
.hero+.pd,.kh+.pd{padding-top:12px}
.hero.cover{padding:0;height:118px}

/* ---------- 10. KARTU MITRA / STATISTIK ---------- */
.mh{position:relative;overflow:hidden;border-radius:28px;box-shadow:0 22px 38px -18px rgba(76,29,149,.85)}
.mh::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.26),rgba(255,255,255,0) 70%);pointer-events:none}
.mh>*{position:relative;z-index:1}
.mh .plus{border-radius:16px;box-shadow:0 10px 18px -10px rgba(0,0,0,.5)}
.card.st3{padding:14px 6px}
.card.st3>div{padding:2px 4px}
.card.st3>div+div{border-left:1px solid var(--ln)}
.st3 b{font-weight:800;letter-spacing:-.03em}

/* ---------- 11. BARIS DAFTAR ---------- */
.lr .ci,.it .ci,.nfi .ci,.rh .ci,.cvr .ci{background:var(--tile);color:var(--tile-c);border-radius:15px;box-shadow:var(--cv-hl)}
.lr .ci,.it .ci{width:44px;height:44px}
.lr>span:last-child:has(svg){width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--mu);flex:none}
.lr>span:last-child .i{width:15px;height:15px}
.lr b,.it b{font-weight:700}
.tag{font-weight:800;padding:3px 10px}
.bd{font-weight:800}

/* ---------- 12. PROFIL ---------- */
.pf{margin:-46px 22px 0!important;z-index:1;box-shadow:var(--sh2)}
.pf .av{box-shadow:0 0 0 4px var(--cd),0 10px 20px -10px rgba(0,0,0,.4)}
.avwrap .cam{background:var(--grad);box-shadow:0 0 0 3px var(--cd)}
.pf h3{font-size:17px;letter-spacing:-.02em}

/* ---------- 13. NAV BAWAH ---------- */
.nv{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border:0;border-radius:28px;padding:8px 6px;background:var(--cd);
  box-shadow:0 18px 38px -12px rgba(49,24,110,.42),0 0 0 1px rgba(124,58,237,.07)}
html[data-theme=dark] .nv{box-shadow:0 18px 38px -12px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.06)}
.nv button{border-radius:18px;font-size:10.5px;font-weight:700;gap:3px;color:var(--mu)}
.nv b{display:grid;place-items:center;font-weight:400;border-radius:14px;padding:5px 16px;transition:background .2s}
.nv b .i{width:21px;height:21px}
.nv .on:not(.mc){background:none;color:var(--p)}
html[data-theme=dark] .nv .on:not(.mc){color:#c4b0ff}
.nv .on:not(.mc) b{background:var(--grad);color:#fff;box-shadow:var(--glow);animation:gvNav .42s cubic-bezier(.3,1.7,.5,1)}
.nv .mc b{padding:0;box-shadow:0 14px 22px -10px rgba(91,33,182,.85);border-color:var(--cd)}
.nv .mc.on b{animation:gvNav .42s cubic-bezier(.3,1.7,.5,1)}
@keyframes gvNav{0%{transform:translateY(8px) scale(.8)}100%{transform:none}}
.fab{background:var(--grad);box-shadow:0 14px 24px -10px rgba(91,33,182,.9)}

/* ---------- 14. SHEET, TOAST, POPUP ---------- */
.bk{background:rgba(18,9,40,.55)}
.sh{border-radius:30px 30px 0 0;padding-top:24px;box-shadow:0 -16px 44px rgba(18,9,40,.3)}
.sh::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:42px;height:4.5px;border-radius:5px;background:var(--ln)}
#tt{background:#1a1233;border-radius:99px;padding:11px 20px;font-weight:600;font-size:13px;box-shadow:0 16px 30px -12px rgba(0,0,0,.6)}
html[data-theme=dark] #tt{background:#2f2650}

/* ---------- 15. KOSONG ---------- */
.em{padding:30px 14px}
.em i{width:92px;height:92px;background:var(--tile);color:var(--p);box-shadow:0 0 0 10px rgba(124,58,237,.07),var(--cv-hl)}
html[data-theme=dark] .em i{color:#c4b0ff;box-shadow:0 0 0 10px rgba(139,92,246,.08)}
.em i .i{width:40px;height:40px}
.em h3{font-size:15.5px;margin-top:6px}

/* ---------- 16. PENCARIAN, PRODUK, GAME ---------- */
.srow{padding:10px}
.sbx{background:var(--bg);border:1.5px solid transparent;border-radius:16px;transition:border-color .15s,box-shadow .15s}
.sbx:focus-within{background:var(--cd);border-color:var(--p);box-shadow:0 0 0 4px rgba(124,58,237,.14)}
.sq{border-radius:15px;background:var(--tile);color:var(--tile-c)}
.sq.g{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.pc,.gc{border:0;border-radius:20px;box-shadow:var(--sh1);transition:transform .14s}
.pc:active,.gc:active{transform:scale(.97)}
html[data-theme=dark] .pc,html[data-theme=dark] .gc{border:1px solid var(--ln);box-shadow:none}
.pt{background:var(--grad);border-radius:14px 0 14px 0}
.gc .ar{background:var(--pl);border-radius:11px}
.tp{background:var(--pl);font-weight:800}
.pb{border-radius:26px;box-shadow:0 22px 36px -18px rgba(76,29,149,.8)}
.big{font-size:21px;font-weight:800;letter-spacing:-.025em}
.wbtn{border-radius:99px;box-shadow:0 10px 18px -10px rgba(0,0,0,.5);font-weight:800}
.hs .chip{padding:9px 16px}
.tl{font-size:16px;letter-spacing:-.02em}

/* ---------- 17. CHAT ---------- */
.cb{border:0;box-shadow:var(--sh1);border-radius:20px 20px 20px 6px}
.cb.me{background:var(--grad);border-radius:20px 20px 6px 20px;box-shadow:var(--glow)}
.ci2 div{border:0;box-shadow:var(--sh2);border-radius:28px}

/* ---------- 18. QRIS ---------- */
.qp h1{font-weight:800;letter-spacing:-.04em}
.qc{position:relative;overflow:hidden;border-radius:30px;box-shadow:0 26px 42px -20px rgba(76,29,149,.9)}
.qc::before{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.22),rgba(255,255,255,0) 70%);pointer-events:none}
.qc>*{position:relative}
.qs{border-radius:20px}
.ql{border:0;border-radius:20px;box-shadow:var(--sh1)}
.ql .ci{background:var(--tile);color:var(--tile-c);border-radius:16px}
.up{border-color:rgba(124,58,237,.3);border-radius:22px;background:var(--bg)}
.up i{background:var(--tile);color:var(--tile-c)}
.qvc,.qbal,.qdet{border-radius:20px}

/* ---------- 19. AUTH ---------- */
.au{background:radial-gradient(120% 55% at 50% -8%,#e6d8ff 0%,rgba(246,243,255,0) 62%),var(--bg)}
html[data-theme=dark] .au{background:radial-gradient(120% 55% at 50% -8%,#34205f 0%,rgba(13,9,25,0) 62%),var(--bg)}
.aw{padding-top:36px}
.aw h1{font-size:26px;font-weight:800;letter-spacing:-.035em}
.alogoimg{width:92px;height:92px;border-radius:26px;box-shadow:0 20px 34px -14px rgba(91,33,182,.7),0 0 0 6px rgba(255,255,255,.7)}
html[data-theme=dark] .alogoimg{box-shadow:0 20px 34px -14px rgba(0,0,0,.8),0 0 0 6px rgba(255,255,255,.06)}

/* ---------- 20. ADMIN / LAIN-LAIN ---------- */
.cs .card{border-radius:20px}
.cs .cico{border-radius:15px}
.dr .pn{border-radius:0 28px 28px 0}
.rk{border-radius:18px}
.pod .st{border-radius:14px 14px 0 0}
.kv.tot b{font-weight:800}
.okc i{box-shadow:0 14px 24px -10px rgba(91,33,182,.8)}
.rx button{background:var(--pl);transition:transform .14s}
.rx button.on{background:var(--grad);color:#fff}
.bimg{border-radius:18px}
.bn2{border-radius:24px;box-shadow:0 20px 34px -18px rgba(76,29,149,.8)}

/* ---------- 21. GERAK: sekali saat pindah halaman ---------- */
@keyframes gvIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#pg.a-f>.pd>*:nth-child(-n+7),#pg.a-u>.pd>*:nth-child(-n+7),#pg.a-b>.pd>*:nth-child(-n+7),
#pg.a-f>.sw>*,#pg.a-u>.sw>*,#pg.a-f>.hero,#pg.a-u>.hero,#pg.a-f>.mh,#pg.a-u>.mh,#pg.a-f>.kh,#pg.a-u>.kh{animation:gvIn .42s cubic-bezier(.2,.8,.2,1) both}
#pg.a-f>.pd>*:nth-child(2),#pg.a-u>.pd>*:nth-child(2),#pg.a-b>.pd>*:nth-child(2){animation-delay:.05s}
#pg.a-f>.pd>*:nth-child(3),#pg.a-u>.pd>*:nth-child(3),#pg.a-b>.pd>*:nth-child(3){animation-delay:.1s}
#pg.a-f>.pd>*:nth-child(4),#pg.a-u>.pd>*:nth-child(4),#pg.a-b>.pd>*:nth-child(4){animation-delay:.15s}
#pg.a-f>.pd>*:nth-child(5),#pg.a-u>.pd>*:nth-child(5),#pg.a-b>.pd>*:nth-child(5){animation-delay:.2s}
#pg.a-f>.pd>*:nth-child(6),#pg.a-u>.pd>*:nth-child(6),#pg.a-b>.pd>*:nth-child(6){animation-delay:.25s}
#pg.a-f>.pd>*:nth-child(7),#pg.a-u>.pd>*:nth-child(7),#pg.a-b>.pd>*:nth-child(7){animation-delay:.3s}
@media (prefers-reduced-motion:reduce){
  .bell .dotr,.nv .on b,.nv .mc.on b{animation:none!important}
}

/* ---------- 22. PEMBAYARAN FULL HALAMAN ---------- */
@keyframes gvFull{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.sh.full{top:0;bottom:0;height:100%;max-height:none;border-radius:0;background:var(--bg);gap:12px;
  padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));animation:gvFull .32s cubic-bezier(.2,.8,.2,1)}
.sh.full::before,.sh.full .gr{display:none}
.fhd{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:12px;flex:none;background:var(--bg);
  padding:calc(12px + env(safe-area-inset-top,0px)) 0 10px;font-size:17px;font-weight:800;letter-spacing:-.025em}
.fhd button{width:40px;height:40px;border-radius:14px;background:var(--cd);box-shadow:var(--sh1);display:grid;place-items:center;color:var(--tx);flex:none}
.fhd button .i{width:20px;height:20px}
.sh.full .qph h3{display:none}
.sh.full .qph{justify-content:flex-end;min-height:0}
.sh.full .qdet,.sh.full .qbal{background:var(--cd);box-shadow:var(--sh1)}
.sh.full .btn.w{padding:15px;font-size:15px}
.sh.full .okc{margin-top:12vh}

/* ---------- 23. KOTAK VOUCHER (kupon) ---------- */
.qvc{background:var(--cd);border:1.5px dashed rgba(124,58,237,.38);border-radius:20px;padding:14px;position:relative}
.qvh{gap:10px;margin-bottom:12px}
.qvh span{background:var(--pl);color:var(--tile-c);padding:4px 11px;border-radius:99px;font-size:11.5px;font-weight:800;white-space:nowrap;flex:none}
.qvin{gap:8px;align-items:stretch}
.qvin .in{background:var(--bg);border-color:transparent;height:48px;font-weight:700;letter-spacing:.02em}
.qvin .qclaim{flex:none;height:48px;padding:0 20px;border-radius:15px;display:inline-flex;align-items:center;gap:7px;font-size:14px}
.qvin .qclaim .i{width:17px;height:17px}
.qvi{border-radius:16px}

/* ---------- 24. ANNOUNCEMENT HALUS ---------- */
.mt{overflow:hidden}
.mt span{will-change:transform;white-space:nowrap}

/* ---------- 25. LOADING: tombol sibuk + overlay ---------- */
@keyframes gvSpin{to{transform:rotate(360deg)}}
@keyframes gvFade{from{opacity:0}to{opacity:1}}
@keyframes gvPulse{0%,100%{transform:scale(.55);opacity:.45}50%{transform:scale(1);opacity:1}}
@keyframes gvDot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes gvBar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes gvPop{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
@keyframes gvSheen{0%{background-position:-160px 0}100%{background-position:260px 0}}
.gv-busy{pointer-events:none;position:relative;color:transparent!important;
  background-image:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%),var(--grad);
  background-size:160px 100%,100% 100%;background-repeat:no-repeat;animation:gvSheen 1s linear infinite}
.gv-busy>*{opacity:0}
.gv-busy::after{content:"";position:absolute;inset:0;margin:auto;width:20px;height:20px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:gvSpin .7s linear infinite}
.btn.g2.gv-busy,.btn.o.gv-busy{background-image:linear-gradient(110deg,transparent 30%,rgba(124,58,237,.18) 50%,transparent 70%);background-color:var(--pl)}
.btn.g2.gv-busy::after,.btn.o.gv-busy::after{border-color:rgba(124,58,237,.25);border-top-color:var(--p)}
#gvl{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:rgba(18,9,40,.55);animation:gvFade .2s both}
#gvl.out{opacity:0;transition:opacity .2s}
.gvl-c{width:min(78%,300px);background:var(--cd);border-radius:28px;padding:26px 20px 22px;text-align:center;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.6);animation:gvPop .35s cubic-bezier(.3,1.5,.5,1) both;overflow:hidden;position:relative}
.gvl-qr{display:grid;grid-template-columns:repeat(3,18px);gap:5px;justify-content:center;margin:0 auto 18px;padding:12px;border-radius:18px;background:var(--pl);width:max-content}
.gvl-qr i{width:18px;height:18px;border-radius:5px;background:var(--grad);animation:gvPulse 1.2s ease-in-out infinite}
.gvl-qr i:nth-child(2),.gvl-qr i:nth-child(4){animation-delay:.12s}
.gvl-qr i:nth-child(3),.gvl-qr i:nth-child(5),.gvl-qr i:nth-child(7){animation-delay:.24s}
.gvl-qr i:nth-child(6),.gvl-qr i:nth-child(8){animation-delay:.36s}
.gvl-qr i:nth-child(9){animation-delay:.48s}
.gvl-c b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em}
.gvl-d{display:inline-flex;gap:3px;margin-left:4px;vertical-align:middle}
.gvl-d u{width:4px;height:4px;border-radius:50%;background:var(--p);animation:gvDot 1s infinite}
.gvl-d u:nth-child(2){animation-delay:.15s}.gvl-d u:nth-child(3){animation-delay:.3s}
.gvl-c small{display:block;margin-top:6px;color:var(--mu);font-size:12.5px}
.gvl-bar{margin-top:16px;height:5px;border-radius:5px;background:var(--pl);overflow:hidden}
.gvl-bar i{display:block;width:40%;height:100%;border-radius:5px;background:var(--grad);animation:gvBar 1.1s ease-in-out infinite}
/* hasil muncul hidup */
.sh.full .qpay>*{animation:gvIn .45s cubic-bezier(.2,.8,.2,1) both}
.sh.full .qpay>*:nth-child(2){animation-delay:.06s}.sh.full .qpay>*:nth-child(3){animation-delay:.12s}
.sh.full .qpay>*:nth-child(4){animation-delay:.18s}.sh.full .qpay>*:nth-child(5){animation-delay:.24s}
.qcard2{animation:gvPop .5s cubic-bezier(.3,1.4,.5,1) both}
.okc i{animation:gvPop .55s cubic-bezier(.3,1.7,.5,1) both}
@media (prefers-reduced-motion:reduce){.gv-busy,.gvl-qr i,.gvl-bar i,.gvl-d u{animation:none!important}}
.sh .gr{display:none}


/* ===== Tombol mata saldo (Beranda) ===== */
.sw .sc small button.eyb{margin-left:auto;position:relative;width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.38);box-shadow:0 2px 8px rgba(40,10,110,.28),inset 0 1px 0 rgba(255,255,255,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:transform .18s cubic-bezier(.3,1.5,.5,1),background .2s,color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent;cursor:pointer}
.sw .sc small button.eyb::before{content:"";position:absolute;inset:-8px}
.sw .sc small button.eyb .i{width:17px;height:17px;stroke-width:2.1}
.sw .sc small{min-height:30px}
.sw .sc small button.eyb:active{transform:scale(.86)}
.sw .sc small button.eyb.off{background:#fff;color:var(--p2,#6d28d9);border-color:#fff;box-shadow:0 3px 10px rgba(40,10,110,.35)}
.sw .sc small button.eyb:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sw .sc b.mk{display:flex;align-items:center;gap:5px;min-height:1.3em}
.sw .sc b.mk u{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;opacity:.92;text-decoration:none}

/* ===== Deteksi operator & cek nama ===== */
.opw:empty{display:none}
.opc{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding:10px 12px;border-radius:14px;font-size:12.5px;line-height:1.4;color:var(--tx);border:1px solid transparent}
.opc>svg,.opc>.ckspin{flex:none;width:18px;height:18px;margin-top:1px}
.opc b{display:block;font-size:13px}.opc small{display:block;margin-top:2px;font-size:12px;color:var(--mu)}
.opc.ok{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.38)}.opc.ok>svg,.opc.ok b{color:var(--okt)}
.opc.bad{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.42)}.opc.bad>svg,.opc.bad>div>b{color:var(--ert)}
.opc.unk{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.42)}.opc.unk>svg,.opc.unk>.ckspin{color:var(--wat)}
.opc .ckn{font-size:15px;letter-spacing:.01em;text-transform:uppercase}
.opsw{margin:8px 6px 0 0;padding:7px 14px;border-radius:99px;background:var(--p);color:#fff;font-weight:700;font-size:12px}
.ckw{margin-top:10px}
