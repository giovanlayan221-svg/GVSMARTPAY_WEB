'<section id="fitur" style="padding-top:0"><div class="wrap"><div class="sh"><h2>Apa yang Bisa Kamu Nikmati?</h2></div><div class="fg">'+feats+'</div></div></section>'+

(isAdmin?'<button class="btn btn-p fab" id="fab" style="display:inline-flex">'+ic('star')+'Kelola konten</button>':'');

function bind(){
const A=document.getElementById('app');
A.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();const id=a.dataset.go;const dr=document.getElementById('dr'),mb2=document.getElementById('mb');if(dr)dr.classList.remove('on');if(mb2)mb2.setAttribute('aria-expanded','false');setTimeout(()=>{if(id==='top'){window.scrollTo({top:0,behavior:'smooth'});return}const el=document.getElementById(id);if(!el)return;const nv=document.querySelector('nav'),off=(nv?nv.getBoundingClientRect().height:60)+8;window.scrollTo({top:Math.max(0,el.getBoundingClientRect().top+window.scrollY-off),behavior:'smooth'})},60)});
const mb=document.getElementById('mb');if(mb)mb.onclick=()=>{const d=document.getElementById('dr');d.classList.toggle('on');mb.setAttribute('aria-expanded',d.classList.contains('on'))};
A.querySelectorAll('[data-soon]').forEach(b=>b.onclick=()=>{const m=document.getElementById('soon');m.classList.add('on');document.getElementById('download').scrollIntoView({behavior:'smooth'})});
A.querySelectorAll('[data-priv]').forEach(a=>a.onclick=e=>{e.preventDefault();toast('Halaman kebijakan privasi belum tersedia.')});
A.querySelectorAll('[data-z]').forEach(f=>f.onclick=()=>{const s=S.shots[+f.dataset.z];document.getElementById('lbi').src=s.url;document.getElementById('lbi').alt=s.label||'Screenshot';document.getElementById('lb').classList.add('on')});
const fab=document.getElementById('fab');if(fab)fab.onclick=openPanel}
const lb=document.getElementById('lb');lb.onclick=e=>{if(e.target===lb||e.target.closest('#lbx'))lb.classList.remove('on')};
/* ADMIN */
function fld(k,l,ph,t){return '<label>'+l+'</label><input data-k="'+k+'" type="'+(t||'text')+'" value="'+esc(D[k])+'" placeholder="'+(ph||'')+'">'}
function openPanel(){D=JSON.parse(JSON.stringify(S));drawPanel();document.getElementById('pn').classList.add('on')}
function drawPanel(){
let p=document.getElementById('pn');if(!p){p=document.createElement('div');p.id='pn';p.className='pn';document.body.appendChild(p)}
const up=assets?'':'<p style="color:var(--mute);font-size:14px">Unggah gambar hanya tersedia untuk editor artifact ini.</p>';
p.innerHTML='<div class="pnb"><h3>Kelola konten</h3><p style="color:var(--mute);margin:0;font-size:14px">Perubahan baru tampil ke pengunjung setelah menekan Simpan &amp; Terbitkan.</p>'+
'<h4>Aplikasi</h4><label>Nama aplikasi</label><input data-k="name" value="'+esc(D.name)+'"><label>Deskripsi</label><textarea data-k="desc">'+esc(D.desc)+'</textarea>'+
'<label>Logo (PNG/JPG/WebP, maks 2 MB)</label><div class="row"><img src="'+esc(D.logo)+'" alt="" style="height:42px" class="'+(D.logo?'':'hide')+'"><span class="t">'+(D.logo?'Logo terunggah':'Belum ada logo')+'</span><button class="ib" data-up="logo" aria-label="Unggah logo">'+ic('dl')+'</button></div>'+
'<h4>Informasi APK</h4>'+fld('version','Nomor versi','mis. isi sesuai APK')+fld('size','Ukuran file','mis. isi sesuai APK')+fld('date','Tanggal pembaruan','')+fld('minAndroid','Minimum Android','')+fld('apkUrl','URL unduhan APK (https)','https://...','url')+fld('privacyUrl','URL Kebijakan Privasi (https)','https://...','url')+
'<h4>Screenshot</h4>'+up+D.shots.map((s,i)=>'<div class="row"><img src="'+esc(s.url)+'" alt=""><div class="t"><input data-sl="'+i+'" value="'+esc(s.label||'')+'" placeholder="Label"></div><button class="ib" data-m="'+i+'" data-d="-1" aria-label="Naik">&uarr;</button><button class="ib" data-m="'+i+'" data-d="1" aria-label="Turun">&darr;</button><button class="ib" data-r="'+i+'" aria-label="Ganti">'+ic('dl')+'</button><button class="ib" data-x="'+i+'" aria-label="Hapus"><svg class="i" viewBox="0 0 24 24"><path d="M5 7h14M10 11v6M14 11v6M7 7l1 13h8l1-13M9 7V4h6v3"/></svg></button></div>').join('')+(assets?'<button class="btn btn-g btn-sm" data-up="new">Tambah screenshot</button>':'')+
'<h4>Fitur</h4>'+D.features.map((f,i)=>'<div class="card" style="padding:12px;margin-bottom:8px;box-shadow:none"><select data-fi="'+i+'" aria-label="Ikon">'+Object.keys(ICONS).map(k=>'<option'+(k===f.icon?' selected':'')+'>'+k+'</option>').join('')+'</select><label>Judul</label><input data-ft="'+i+'" value="'+esc(f.title)+'"><label>Deskripsi</label><textarea data-fd="'+i+'">'+esc(f.desc)+'</textarea><button class="btn btn-g btn-sm" style="margin-top:8px" data-fx="'+i+'">Hapus fitur</button></div>').join('')+'<button class="btn btn-g btn-sm" id="fa">Tambah fitur</button>'+
'<div class="bar"><button class="btn btn-g" id="pc">Batal</button><button class="btn btn-p" id="ps" style="flex:1">Simpan &amp; Terbitkan</button></div></div>';
const q=s=>p.querySelectorAll(s);
q('[data-k]').forEach(e=>e.oninput=()=>D[e.dataset.k]=e.value.trim());
q('[data-sl]').forEach(e=>e.oninput=()=>D.shots[+e.dataset.sl].label=e.value);
q('[data-fi]').forEach(e=>e.onchange=()=>D.features[+e.dataset.fi].icon=e.value);
q('[data-ft]').forEach(e=>e.oninput=()=>D.features[+e.dataset.ft].title=e.value);
q('[data-fd]').forEach(e=>e.oninput=()=>D.features[+e.dataset.fd].desc=e.value);
q('[data-fx]').forEach(e=>e.onclick=()=>{D.features.splice(+e.dataset.fx,1);drawPanel()});
q('[data-x]').forEach(e=>e.onclick=()=>{D.shots.splice(+e.dataset.x,1);drawPanel()});
q('[data-m]').forEach(e=>e.onclick=()=>{const i=+e.dataset.m,j=i+ +e.dataset.d;if(j<0||j>=D.shots.length)return;[D.shots[i],D.shots[j]]=[D.shots[j],D.shots[i]];drawPanel()});
q('[data-up]').forEach(e=>e.onclick=()=>pick(e.dataset.up));
q('[data-r]').forEach(e=>e.onclick=()=>pick('r'+e.dataset.r));
document.getElementById('fa').onclick=()=>{D.features.push({icon:'grid',title:'Judul fitur',desc:'Deskripsi singkat fitur.'});drawPanel()};
document.getElementById('pc').onclick=()=>p.classList.remove('on');
document.getElementById('ps').onclick=save}
function pick(mode){
const inp=document.createElement('input');inp.type='file';inp.accept='image/png,image/jpeg,image/webp';
inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
if(!['image/png','image/jpeg','image/webp'].includes(f.type))return toast('Hanya PNG, JPG, atau WebP.');
const max=mode==='logo'?2e6:6e6;if(f.size>max)return toast('Ukuran file terlalu besar (maks '+max/1e6+' MB).');
if(!assets)return toast('Unggah tidak tersedia.');
toast('Mengunggah...');
try{
const dim=await new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{res([im.naturalWidth,im.naturalHeight]);URL.revokeObjectURL(u)};im.onerror=()=>rej(new Error('bad'));im.src=u});
const r=await assets.upload(f);
if(mode==='logo')D.logo=r.url;
else if(mode==='new')D.shots.push({id:r.id,url:r.url,w:dim[0],h:dim[1],label:''});
else{const i=+mode.slice(1);D.shots[i]={...D.shots[i],id:r.id,url:r.url,w:dim[0],h:dim[1]}}
drawPanel();toast('Gambar terunggah.')
}catch(e){toast('Gagal mengunggah: '+(e&&e.message||'coba lagi'))}};
inp.click()}
async function save(){
if(D.apkUrl&&!okUrl(D.apkUrl))return toast('URL APK harus diawali https://');
if(D.privacyUrl&&!okUrl(D.privacyUrl))return toast('URL Kebijakan Privasi harus diawali https://');
if(!D.name)return toast('Nama aplikasi wajib diisi.');
const btn=document.getElementById('ps');btn.disabled=true;btn.textContent='Menyimpan...';
try{
const art=await claude.use('artifact');if(!art)throw new Error('Penerbitan tidak tersedia untuk akun ini.');
const json=JSON.stringify(D).replace(/</g,'\\u003c');
let html=BASE.replace(/(<script id="state" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b);
html=html.replace(/<title>[\s\S]*?<\/title>/,'<title>'+esc(D.name)+' - Download Aplikasi Android</title>');
await art.publish(html);
}catch(e){btn.disabled=false;btn.innerHTML='Simpan &amp; Terbitkan';toast('Gagal menyimpan: '+(e&&e.message||'coba lagi'))}}
render();
(async()=>{try{const u=await claude.use('user');isAdmin=!!(u&&u.canEdit&&u.canEdit());if(isAdmin){assets=await claude.use('assets');render()}}catch(e){}})();
</script></body></html>
